name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

jobs:
  py-ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The ruff version uv.lock pins, not the newest release.
      - name: Lint with Ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: uv.lock
      - name: Format with Ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: uv.lock
          args: "format --check"

  py-pyright:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    env:
      # without this, uv follows .python-version (3.11) instead of the matrix
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: meridianlabs-ai/actions/install-python-dependencies@3bc608093ab8b8dd7f82764a863d9d5f9dce61a5 # main
        with:
          versions: locked
          python-version: ${{ matrix.python-version }}
          extras: dev
      - name: Run pyright
        run: uv run --no-sync pyright
      - name: Minimize uv cache
        if: ${{ !cancelled() }}
        run: uv cache prune --ci

  py-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    env:
      # without this, uv follows .python-version (3.11) instead of the matrix
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: meridianlabs-ai/actions/install-python-dependencies@3bc608093ab8b8dd7f82764a863d9d5f9dce61a5 # main
        with:
          versions: locked
          python-version: ${{ matrix.python-version }}
          extras: dev
      - name: Run tests
        run: uv run --no-sync pytest
      - name: Minimize uv cache
        if: ${{ !cancelled() }}
        run: uv cache prune --ci

  py-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    env:
      # without this, uv follows .python-version (3.11) instead of the matrix
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The project's locked dependencies, not the project itself: a later step
      # installs the wheel.
      - uses: meridianlabs-ai/actions/install-python-dependencies@3bc608093ab8b8dd7f82764a863d9d5f9dce61a5 # main
        with:
          versions: locked
          python-version: ${{ matrix.python-version }}
          project-install: skip
      - name: Build package
        id: build
        run: |
          uv build
          wheels=(dist/*.whl)
          [ ${#wheels[@]} -eq 1 ] && [ -f "${wheels[0]}" ] || { echo "::error::expected one wheel in dist/"; exit 1; }
          # ./ marks a local path for the install action.
          echo "wheel=./${wheels[0]}" >> "$GITHUB_OUTPUT"
      # The wheel, with --no-deps: the step above installed its dependencies.
      - uses: meridianlabs-ai/actions/install-python-dependencies@3bc608093ab8b8dd7f82764a863d9d5f9dce61a5 # main
        with:
          versions: locked
          python-version: ${{ matrix.python-version }}
          project-install: skip
          also-install-without-deps: ${{ steps.build.outputs.wheel }}
      - name: Verify package
        # -I so the import resolves to the installed wheel, not the checkout's src/.
        run: .venv/bin/python -I -c "import inspect_swarm; print('Package imported successfully')"
      - name: Minimize uv cache
        if: ${{ !cancelled() }}
        run: uv cache prune --ci
