version: 2
updates:
  # Actions are pinned to commit SHAs with a `# vX.Y.Z` comment; Dependabot
  # bumps both. A `<sha> # main` pin (meridianlabs-ai/actions, until a release
  # tag has the shared Python actions) moves to that branch's head, with no
  # cooldown. The cooldown gives a compromised release time to be caught
  # before it is proposed; security updates skip it.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # One PR per week for every action update, majors included.
    groups:
      github-actions:
        patterns:
          - "*"
    # pr-title-lint requires a Conventional Commits title; `ci` keeps these
    # out of the release notes.
    commit-message:
      prefix: "ci"
  # Bumps uv.lock. The cooldown matches `exclude-newer` in pyproject.toml. No
  # package gets a 6-hour cooldown: no direct dependency is a model provider
  # SDK. inspect-ai is ignored: it is a git reference to inspect_ai main, which
  # contributors move with `uv lock --upgrade-package inspect-ai`. When
  # inspect-ai returns to a released floor, stop ignoring it, and add it to
  # `cooldown.exclude` and to its own group, as inspect_scout does.
  - package-ecosystem: "uv"
    versioning-strategy: lockfile-only
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "inspect-ai"
    groups:
      python-packages:
        patterns:
          - "*"
    # `build` keeps these out of the release notes.
    commit-message:
      prefix: "build"
