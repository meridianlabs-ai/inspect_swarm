version: 2
updates:
  # Actions are pinned to commit SHAs with a `# vX.Y.Z` comment; Dependabot
  # bumps both. A `<sha> # main` pin (meridianlabs-ai/actions, until a release
  # tag has the shared Python actions) moves to that branch's head, with no
  # cooldown. The cooldown gives a compromised release time to be caught
  # before it is proposed; security updates skip it.
  - package-ecosystem: "github-actions"
    # / covers the workflows; the local composite actions pin actions too.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # One PR per week for every action update, majors included.
    groups:
      github-actions:
        patterns:
          - "*"
    # pr-title-lint requires a Conventional Commits title; `ci` keeps these
    # out of the release notes.
    commit-message:
      prefix: "ci"
  # Bumps uv.lock. The cooldown matches `exclude-newer` in pyproject.toml. Its
  # only "6 hours" entry in `exclude-newer-package` is inspect-ai, which is
  # ignored: it comes from inspect_ai main, which CI moves to the latest commit
  # on every run. So no package needs `cooldown.exclude` or a 6-hour group.
  # When a direct dependency gets a "6 hours" entry, add it to
  # `cooldown.exclude` and to a `six-hour-cooldown` group listed before
  # `python-packages`, as inspect_scout does: Dependabot's cooldown counts
  # whole days, and puts a package in the first group that matches.
  - package-ecosystem: "uv"
    versioning-strategy: lockfile-only
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "inspect-ai"
    groups:
      python-packages:
        patterns:
          - "*"
    # `build` keeps these out of the release notes.
    commit-message:
      prefix: "build"
  # Bumps the release build toolchain pinned with hashes in
  # scripts/build-dist/requirements.txt.
  - package-ecosystem: "uv"
    directory: "/scripts/build-dist"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      build-toolchain:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
