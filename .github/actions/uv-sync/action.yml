name: Install Python dependencies from uv.lock
description: >-
  Installs uv, Python and exactly the versions in uv.lock. Fails on a uv.lock
  that is out of date with pyproject.toml.

inputs:
  python-version:
    description: Python version to install, for example '3.11'.
    required: true
  extras:
    description: Optional dependencies to install, one name per line.
    required: false
    default: ""
  project-install:
    description: Whether the project installs, editable or skip.
    required: false
    default: editable
  default-dependency-groups:
    description: Whether the default dependency groups install, include or exclude.
    required: false
    default: include
  also-install-without-deps:
    description: Local paths to install with --no-deps, one per line.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: meridianlabs-ai/actions/install-python-dependencies@5e38536660a7c7a03feef16a2e88b41fa54f52c5 # main
      with:
        versions: locked
        python-version: ${{ inputs.python-version }}
        extras: ${{ inputs.extras }}
        project-install: ${{ inputs.project-install }}
        default-dependency-groups: ${{ inputs.default-dependency-groups }}
        also-install-without-deps: ${{ inputs.also-install-without-deps }}

