[project]
name = "inspect_swarm"
dynamic = ["version"]
description = "Evals with multi-agent swarms (experimental)."
authors = [{ name = "Meridian Labs" }]
readme = "README.md"
# Above inspect-ai's 3.10 floor: the swarm runtime uses native ExceptionGroup
# and except*, which are new in 3.11.
requires-python = ">=3.11"
license = { text = "MIT License" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "inspect-ai>=0.3.291",
    # imported directly; inspect-ai depends on them too, but a transitive
    # dependency is not a promise; `TaskInfo.has_pending_cancellation()` needs a
    # recent anyio, and inspect-ai already requires this one
    "anyio>=4.14.2",
    "pydantic>=2.0",
    "shortuuid",
]

[project.urls]
"Source Code" = "https://github.com/meridianlabs-ai/inspect_swarm"
"Issue Tracker" = "https://github.com/meridianlabs-ai/inspect_swarm/issues"
Documentation = "https://meridianlabs-ai.github.io/inspect_swarm/"

# lets inspect_ai resolve `inspect_swarm/<name>` without importing the package first
[project.entry-points.inspect_ai]
inspect_swarm = "inspect_swarm._entrypoint"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    # Claude Code and Codex members in tests/test_isolation_bridged.py; 0.3.2
    # is the first release whose agents run inside a sandbox identity scope
    "inspect-swe>=0.3.2",
    # the agent bridge translates Claude Code's and Codex's requests with them
    "anthropic",
    "openai",
    "ruff",
    "pytest",
    "pyright",
    "pytest-xdist",
    "pytest-timeout>=2.4.0",
    # tests import anyio directly; inspect-ai depends on it too, but a
    # transitive dependency is not a promise
    "anyio>=4.0",
    # async tests run on both anyio backends (tests/conftest.py)
    "trio",
    # inspect_ai.analysis.samples_df(), through which the analysis tests read
    "pandas>=2.1.0",
    "pyarrow>=10.0.1",
    # tests/test_dependency_cooldown.py reads the workflows
    "pyyaml",
]

# The docs build, Quarto included, is in `doc`, which `dev` leaves out: the
# tests never build the docs. 1.9.36 was `make docs`' floor for a system Quarto.
doc = [
    "quarto-cli>=1.9.36",
    "panflute",
    "markdown",
    "griffe>=2",
    "rich",
    "pyyaml",
]

[dependency-groups]
# Keeps a plain `uv sync` or `uv run` (Makefile) and the nightly canary's
# `--group dev` install pulling the dev tools.
dev = ["inspect_swarm[dev]"]
dist = ["twine", "build"]

[tool.hatch.build]
only-packages = true
exclude = ["docs/", "tests/", "design/"]
artifacts = ["src/**/py.typed"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/inspect_swarm/_version.py"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version" # Important for PyPI compatibility

[tool.uv]
managed = true
# 0.11.8 is the first uv that keeps uv.lock stable with a relative exclude-newer,
# and 0.13.4 the first that no longer trusts the compromised emSign root
# (GHSA-hq85-5cpj-mr62).
required-version = ">=0.13.4"
# Only resolve releases at least 7 days old (see CONTRIBUTING.md).
exclude-newer = "7 days"

# No cooldown for Inspect packages; see CONTRIBUTING.md.
[tool.uv.exclude-newer-package]
inspect-ai = false
inspect-swe = false

[tool.ruff]
extend-exclude = ["docs", "design"]
src = [".", "src"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # flake8
    "D",      # pydocstyle
    "I",      # isort
    "B",      # flake8-bugbear
    "SIM101", # duplicate isinstance
]
ignore = ["E203", "E501", "D10", "D212", "D415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-n auto"
timeout = 120
markers = ["slow: needs Docker; runs only with --runslow"]

[tool.pyright]
include = ["src", "tests", "examples"]
typeCheckingMode = "strict"
pythonPlatform = "All"
pythonVersion = "3.11"

# tests may exercise private helpers directly
[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = false
extraPaths = ["."]

# examples import each other as top-level modules, as `inspect eval
# examples/<file>.py` resolves them
[[tool.pyright.executionEnvironments]]
root = "examples"
