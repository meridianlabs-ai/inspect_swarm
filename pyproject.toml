[project]
name = "inspect_swarm"
dynamic = ["version"]
description = "Evals with multi-agent swarms (experimental)."
authors = [{ name = "Meridian Labs" }]
readme = "README.md"
# Above inspect-ai's 3.10 floor: the swarm runtime uses native ExceptionGroup
# and except*, which are new in 3.11.
requires-python = ">=3.11"
license = { text = "MIT License" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
]
dependencies = [
    # Development tracks inspect_ai's `main`: the swarm writes its evidence as
    # CommunicationEvent and SwarmEvent (UKGovernmentBEIS/inspect_ai#6164), and
    # users isolation needs sandbox_identity() (UKGovernmentBEIS/inspect_ai#6190),
    # the member's HOME (#6276) and the proxy's default user in a scope (#6316),
    # which no release has yet. That is done by [tool.uv.sources] below, not by
    # this line: only uv reads it, and the published package requires this
    # floor. Only the Release Please release PR ignores the sources, so a
    # release is tested against PyPI, after release-pin-deps.yml raises this
    # floor to the release it was tested against.
    "inspect-ai>=0.3.286",
    # imported directly; inspect-ai depends on them too, but a transitive
    # dependency is not a promise
    "anyio>=4.0",
    "pydantic>=2.0",
    "shortuuid",
]

[project.urls]
"Source Code" = "https://github.com/meridianlabs-ai/inspect_swarm"
"Issue Tracker" = "https://github.com/meridianlabs-ai/inspect_swarm/issues"
Documentation = "https://meridianlabs-ai.github.io/inspect_swarm/"

# lets inspect_ai resolve `inspect_swarm/<name>` without importing the package first
[project.entry-points.inspect_ai]
inspect_swarm = "inspect_swarm._entrypoint"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pyright",
    "pytest-xdist",
    "pytest-timeout>=2.4.0",
    # tests import anyio directly; inspect-ai depends on it too, but a
    # transitive dependency is not a promise
    "anyio>=4.0",
    # async tests run on both anyio backends (tests/conftest.py)
    "trio",
    # inspect_ai.analysis.samples_df(), through which the analysis tests read
    "pandas>=2.1.0",
    "pyarrow>=10.0.1",
    # tests/test_dependency_cooldown.py reads the workflows
    "pyyaml",
]

[dependency-groups]
# Keeps a plain `uv sync` or `uv run` (Makefile) and the nightly canary's
# `--group dev` install pulling the dev tools.
dev = ["inspect_swarm[dev]"]
# The docs' Python tools are in `doc`, which `dev` leaves out: CI installs `dev`
# and never builds the docs. Quarto itself is a system install (`make docs`
# checks its version), so the lock does not carry the Jupyter stack the
# quarto-cli package pulls in (decision: Ransom, 2026-10-22).
doc = [
    "panflute",
    "markdown",
    "griffe>=2",
    "rich",
    "pyyaml",
]
dist = ["twine", "build"]

[tool.hatch.build]
only-packages = true
exclude = ["docs/", "tests/", "design/"]
artifacts = ["src/**/py.typed"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/inspect_swarm/_version.py"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version" # Important for PyPI compatibility

[tool.uv]
managed = true
# 0.11.8 is the first uv that keeps uv.lock stable with a relative exclude-newer,
# and 0.13.4 the first that no longer trusts the compromised emSign root
# (GHSA-hq85-5cpj-mr62).
required-version = ">=0.13.4"
# Only resolve releases at least 7 days old (see CONTRIBUTING.md).
exclude-newer = "7 days"

# 6 hours only for direct dependencies that are a model provider SDK or an
# Inspect package; see CONTRIBUTING.md.
[tool.uv.exclude-newer-package]
inspect-ai = "6 hours"

# Development and CI track inspect_ai's main. uv.lock records a commit, and CI
# moves it to main's latest (.github/actions/uv-sync). The published package
# requires the floor above, and the release PR's CI installs the newest
# release instead.
[tool.uv.sources]
inspect-ai = { git = "https://github.com/UKGovernmentBEIS/inspect_ai", branch = "main" }

[tool.ruff]
extend-exclude = ["docs", "design"]
src = [".", "src"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # flake8
    "D",      # pydocstyle
    "I",      # isort
    "B",      # flake8-bugbear
    "SIM101", # duplicate isinstance
]
ignore = ["E203", "E501", "D10", "D212", "D415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-n auto"
timeout = 120
markers = ["slow: needs Docker; runs only with --runslow"]

[tool.pyright]
include = ["src", "tests", "examples"]
typeCheckingMode = "strict"
pythonPlatform = "All"
pythonVersion = "3.11"

# tests may exercise private helpers directly
[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = false
extraPaths = ["."]

# examples import each other as top-level modules, as `inspect eval
# examples/<file>.py` resolves them
[[tool.pyright.executionEnvironments]]
root = "examples"
